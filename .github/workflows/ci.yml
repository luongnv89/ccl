name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint + Type + Security (pre-commit)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: constraints-dev.txt
      - name: Install dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" -c constraints-dev.txt
      - name: Run pre-commit (all files, commit stage)
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Run pre-commit (all files, pre-push stage)
        run: pre-commit run --all-files --hook-stage pre-push --show-diff-on-failure

  test:
    name: Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: constraints-dev.txt
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" -c constraints-dev.txt
      - name: Run pytest with coverage
        run: |
          python -m pytest -q --cov=claude_codex_local --cov-report=xml --cov-report=term-missing --cov-fail-under=79
      - name: Coverage gate (report consumes the measured data)
        if: matrix.python-version == '3.11'
        run: python -m coverage report --fail-under=79

      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error

  e2e:
    name: CLI E2E smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: constraints-dev.txt
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -e . -c constraints-dev.txt
      - name: Run CLI smoke script
        env:
          PYTHON: python
        run: bash scripts/e2e_smoke.sh

  e2e-docker:
    name: Docker E2E installation scenarios
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: constraints-dev.txt
      - name: Install build tool
        run: pip install --upgrade build -c constraints-dev.txt
      - name: Run Docker E2E scenarios
        run: bash tests/e2e_docker/run_e2e_docker.sh

  ci-ok:
    name: ci-ok
    needs: [quality, test, e2e, e2e-docker]
    if: always() && !failure() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "All CI jobs passed"
