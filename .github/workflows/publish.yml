name: Publish to PyPI

on:
  release:
    types: [published]
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # required for trusted publishing (OIDC)
  checks: read # guard queries the tagged commit's check runs

jobs:
  # Green-CI precondition (#192 / F-CI-003): the publish path stays closed
  # unless the `ci-ok` aggregate job succeeded on this exact commit. The
  # query is fail-closed — no completed successful ci-ok run means no build.
  guard:
    name: Require green CI on the tagged commit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Query ci-ok on ${{ github.sha }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 30); do
            conclusion="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${{ github.sha }}/check-runs" \
              --jq '[.check_runs[] | select(.name == "ci-ok")][0].conclusion // "pending"')"
            case "$conclusion" in
              success) echo "ci-ok: success"; exit 0 ;;
              pending|queued|null|"")
                echo "ci-ok: ${conclusion:-pending} — waiting"; sleep 20 ;;
              *) echo "ci-ok: ${conclusion} — refusing to publish a red commit"; exit 1 ;;
            esac
          done
          echo "ci-ok did not complete in time — refusing to publish"; exit 1

  build:
    name: Build distribution
    needs: [guard]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install build
        run: pip install build
      - name: Build sdist and wheel
        run: python -m build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/claude-codex-local
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          skip-existing: true
