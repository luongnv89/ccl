default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-merge-conflict
      - id: mixed-line-ending

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        files: ^claude_codex_local/(core|wizard)\.py$
        additional_dependencies: []

  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      # Whole package is in scope; per-line `# nosec B310` comments carry the
      # justifications instead of a blanket --skip list.
      - id: bandit
        args: [-q, -ll]
        files: ^claude_codex_local/

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: [--baseline, .secrets.baseline]
        # tests/ is scanned like any other code; secret-shaped fixture strings
        # carry inline `# pragma: allowlist secret` markers instead.
        exclude: ^(\.claude-codex-local/|\.venv/|.*\.lock$|\.secrets\.baseline$)

  - repo: local
    hooks:
      # Hooks prefer the repo venv python if present, else fall back to python3.
      # The fast subset includes the two modules that reddened main (#184):
      # test_session_bridge.py and test_native_params.py.
      - id: pytest-unit
        name: pytest (unit, fast)
        entry: bash -c 'PY="${PWD}/.venv/bin/python"; [ -x "$PY" ] || PY=python3; "$PY" -m pytest -q tests/test_core_unit.py tests/test_wizard_unit.py tests/test_supplementary.py tests/test_session_bridge.py tests/test_native_params.py'
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: pytest-full
        name: pytest (full non-local suite w/ coverage)
        entry: bash -c 'PY="${PWD}/.venv/bin/python"; [ -x "$PY" ] || PY=python3; "$PY" -m pytest -q -m "not local" --cov=claude_codex_local --cov-report=term-missing --cov-fail-under=79'
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: check-bash-c
        name: gate bash -c shell-outs (issue #201 allowlist)
        entry: bash -c 'PY="${PWD}/.venv/bin/python"; [ -x "$PY" ] || PY=python3; "$PY" scripts/check_bash_c.py'
        language: system
        pass_filenames: false
        stages: [pre-commit, pre-push]

      - id: e2e-cli
        name: CLI end-to-end smoke
        entry: bash scripts/e2e_smoke.sh
        language: system
        pass_filenames: false
        stages: [pre-push]
